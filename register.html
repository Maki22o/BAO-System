<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Create Account | BAO Storage System</title>

  <!-- GOOGLE FONT -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <!-- =====================================
       THEME TOGGLE
  ====================================== -->

  <button
    id="themeToggle"
    class="theme-toggle"
    aria-label="Toggle Theme"
  >

    <span id="themeIcon">

      <i data-lucide="moon"></i>

    </span>

  </button>

  <!-- =====================================
       BACKGROUND
  ====================================== -->

  <div class="background-overlay"></div>

  <!-- =====================================
       MAIN CONTAINER
  ====================================== -->

  <main class="container">

    <!-- =====================================
         LEFT PANEL
    ====================================== -->

    <section class="left-panel">

      <div class="branding">

        <!-- BRAND TOP -->
        <div class="brand-top">

          <img
            src="LSPULOGO3-removebg-preview.png"
            class="brand-logo"
            alt="LSPU Logo"
          />

          <span class="system-badge">
            Laguna State Polytechnic University
          </span>

        </div>

        <!-- TITLE -->
        <h1>
          BAO Storage
          Management
          System
        </h1>

        <!-- DESCRIPTION -->
        <p>
          Create your account to securely access and manage institutional
          storage records within the centralized platform.
        </p>

      </div>

    </section>

    <!-- =====================================
         RIGHT PANEL
    ====================================== -->

    <section class="right-panel">

      <div class="login-card">

        <!-- HEADER -->
        <div class="login-header">

          <h2>Create Account</h2>

          <p>
            Start managing your storage system
          </p>

        </div>

        <!-- FORM -->
        <div class="form">

          <!-- FULL NAME -->
          <div class="form-group">

            <input
              type="text"
              id="registerName"
              required
              placeholder=" "
              autocomplete="name"
            />

            <label>Full Name</label>

          </div>

          <!-- EMAIL -->
          <div class="form-group">

            <input
              type="email"
              id="registerEmail"
              required
              placeholder=" "
              autocomplete="email"
            />

            <label>Email Address</label>

          </div>

          <!-- PASSWORD -->
          <div class="form-group">

            <input
              type="password"
              id="registerPassword"
              required
              placeholder=" "
              autocomplete="new-password"
            />

            <label>Password</label>

            <span
              class="toggle"
              onclick="togglePassword('registerPassword')"
            >

              <i data-lucide="eye"></i>

            </span>

          </div>

          <!-- CONFIRM PASSWORD -->
          <div class="form-group">

            <input
              type="password"
              id="confirmPassword"
              required
              placeholder=" "
              autocomplete="new-password"
            />

            <label>Confirm Password</label>

            <span
              class="toggle"
              onclick="togglePassword('confirmPassword')"
            >

              <i data-lucide="eye"></i>

            </span>

          </div>

          <!-- BUTTON -->
          <button
            class="login-btn"
            onclick="register(this)"
          >
            Create Account
          </button>

        </div>

        <!-- FOOTER -->
        <div class="bottom-text">

          Already have an account?
          <a href="index.html">
            Sign in
          </a>

        </div>

      </div>

    </section>

  </main>

  <!-- =====================================
       TOAST
  ====================================== -->

  <div id="toast"></div>

  <!-- =====================================
       SUPABASE CDN
  ====================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- =====================================
       LUCIDE ICONS
  ====================================== -->

  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- =====================================
       SCRIPT
  ====================================== -->

  <script src="script.js"></script>

  <!-- =====================================
       INITIALIZE ICONS
  ====================================== -->

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
