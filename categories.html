<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories | BAO Storage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="categories.css">
</head>
<body>

<div class="layout">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <header class="sidebar-header">
      <div class="sidebar-brand">
        <img src="LSPULOGO3-removebg-preview.png" alt="LSPU Logo" class="sidebar-logo">
        <div>
          <h2>BAO Storage</h2>
          <p class="sub">Inventory Management</p>
        </div>
      </div>
    </header>

    <nav class="sidebar-nav">
      <a href="dashboard.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a href="products.html"><i data-lucide="package"></i><span>Products</span></a>
      <a href="categories.html" class="active"><i data-lucide="folder"></i><span>Categories</span></a>
      <a href="transactions.html"><i data-lucide="receipt"></i><span>Transactions</span></a>
      <a href="admin.html"><i data-lucide="shield"></i><span>User Management</span></a>
      <a href="reports.html"><i data-lucide="file-bar-chart"></i><span>Reports</span></a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout" onclick="logout()"><i data-lucide="log-out"></i><span>Logout</span></button>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main">
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
      <span id="themeIcon"><i data-lucide="moon"></i></span>
    </button>

    <header class="topbar">
      <div>
        <h1>Categories</h1>
        <p>Manage your product categories</p>
      </div>

      <button class="add-btn" onclick="openAdd()">+ Add Category</button>
    </header>

    <section class="controls">
      <input 
        type="text" 
        id="searchCat" 
        placeholder="Search category..."
        oninput="renderTable()"
      >
    </section>

    <section class="table-container">
      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th>Products</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>
      </table>

      <div id="emptyState" class="empty-state" style="display:none;">
        <p>No categories found</p>
      </div>
    </section>

  </main>
</div>

<!-- ===== MODAL ===== -->
<div id="modal" class="modal">
  <div class="modal-content">

    <h2 id="modalTitle">Add Category</h2>

    <div class="form">

      <!-- ✅ STABLE INPUT -->
      <div class="form-group">
        <input 
          type="text" 
          id="name" 
          placeholder=" " 
          autocomplete="off"
          required
        >
        <label for="name">Category Name</label>
      </div>

      <!-- ✅ BUTTONS -->
      <div class="modal-actions">
        <button type="button" class="btn cancel" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn primary" onclick="saveCategory()">Save</button>
      </div>

    </div>

  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-auth.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="categories.js"></script>
<script>
  (function() {
    const savedTheme = localStorage.getItem("theme");
    const isLight = savedTheme === "light";
    if (isLight) document.body.classList.add("light-mode");
    const icon = document.getElementById("themeIcon");
    const toggle = document.getElementById("themeToggle");
    function refreshThemeIcon(light) {
      icon.innerHTML = light ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
      lucide.createIcons();
    }
    toggle.addEventListener("click", function() {
      document.body.classList.toggle("light-mode");
      const light = document.body.classList.contains("light-mode");
      localStorage.setItem("theme", light ? "light" : "dark");
      refreshThemeIcon(light);
    });
    refreshThemeIcon(isLight);
  })();
</script>

</body>
</html>
