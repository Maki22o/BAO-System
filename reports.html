<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports | BAO Storage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="reports.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <header class="sidebar-header">
      <div class="sidebar-brand">
        <img src="LSPULOGO3-removebg-preview.png" alt="LSPU Logo" class="sidebar-logo">
        <div>
          <h2>BAO Storage</h2>
          <p class="sub">Inventory Management</p>
        </div>
      </div>
    </header>

    <nav class="sidebar-nav">
      <a href="dashboard.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a href="products.html"><i data-lucide="package"></i><span>Products</span></a>
      <a href="categories.html"><i data-lucide="folder"></i><span>Categories</span></a>
      <a href="transactions.html"><i data-lucide="receipt"></i><span>Transactions</span></a>
      <a href="admin.html" id="adminLink"><i data-lucide="shield"></i><span>User Management</span></a>
      <a href="reports.html" class="active"><i data-lucide="file-bar-chart"></i><span>Reports</span></a>
    </nav>

    <footer class="sidebar-footer">
      <button class="logout" onclick="logout()"><i data-lucide="log-out"></i><span>Logout</span></button>
    </footer>
  </aside>

  <main class="main">
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
      <span id="themeIcon"><i data-lucide="moon"></i></span>
    </button>

    <div class="topbar">
      <div>
        <h1>Reports</h1>
        <p>Analyze your sales and performance</p>
      </div>
    </div>

    <div class="controls">
      <input type="date" id="startDate">
      <input type="date" id="endDate">
      <button onclick="loadReports()">Apply</button>
    </div>

    <div class="stats">
      <div class="card">
        <p>Total Sales</p>
        <h3 id="totalSales">P0</h3>
      </div>

      <div class="card">
        <p>Transactions</p>
        <h3 id="totalTxns">0</h3>
      </div>

      <div class="card">
        <p>Average Sale</p>
        <h3 id="avgSale">P0</h3>
      </div>
    </div>

    <div class="panel">
      <h3>Sales Trend</h3>
      <canvas id="salesChart"></canvas>
    </div>

    <div class="panel">
      <h3>Product Performance</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Sold</th>
              <th>Revenue</th>
            </tr>
          </thead>
          <tbody id="reportTable"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h3>Insights</h3>
      <div id="insights"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-auth.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="reports.js"></script>
<script>
  (function() {
    const savedTheme = localStorage.getItem("theme");
    const isLight = savedTheme === "light";
    if (isLight) document.body.classList.add("light-mode");
    const icon = document.getElementById("themeIcon");
    const toggle = document.getElementById("themeToggle");
    function refreshThemeIcon(light) {
      icon.innerHTML = light ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
      lucide.createIcons();
    }
    toggle.addEventListener("click", function() {
      document.body.classList.toggle("light-mode");
      const light = document.body.classList.contains("light-mode");
      localStorage.setItem("theme", light ? "light" : "dark");
      refreshThemeIcon(light);
    });
    refreshThemeIcon(isLight);
  })();
</script>

</body>
</html>
