<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Products | BAO Storage</title>
<link rel="stylesheet" href="products.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <header class="sidebar-header">
      <h2>BAO Storage</h2>
      <p class="sub">Inventory Management</p>
    </header>

    <nav class="sidebar-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html" class="active">Products</a>
      <a href="categories.html">Categories</a>
      <a href="transactions.html">Transactions</a>
      <a href="admin.html">Admin</a>
      <a href="reports.html">Reports</a>
    </nav>

    <footer class="sidebar-footer">
      <button class="logout" onclick="logout()">Logout</button>
    </footer>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="topbar-left">
        <h1>Products</h1>
        <p>Manage and monitor your inventory items</p>
      </div>
    </header>

    <!-- CONTROLS -->
    <section class="controls">

      <div class="search-box">
        <input type="text" id="search" placeholder="Search products..." oninput="renderTable()">
      </div>

      <div class="right-controls">
        <select id="filter" onchange="renderTable()">
          <option value="All">All Categories</option>
          <option value="Uniforms">Uniforms</option>
          <option value="Books">Books</option>
          <option value="PE Wear">PE Wear</option>
          <option value="ID Laces">ID Laces</option>
        </select>

        <button class="add-btn" onclick="openAdd()">+ Add Product</button>
      </div>

    </section>

    <!-- TABLE -->
    <section class="table-container">
      <table class="product-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Product Name</th>
            <th>Category</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="tableBody">
          <!-- JS RENDER -->
          <!-- SAMPLE STRUCTURE -->
          <!--
          <tr>
            <td>P123</td>
            <td>Sample Product</td>
            <td>Books</td>
            <td>10</td>
            <td>₱100</td>
            <td>In Stock</td>
            <td>
              <div class="actions">
                <button class="edit-btn">✏️ Edit</button>
                <button class="sell-btn">🛒 Sell</button>
                <button class="delete-btn">🗑 Delete</button>
              </div>
            </td>
          </tr>
          -->
        </tbody>
      </table>
    </section>

  </main>
</div>

<!-- ================= ADD / EDIT PRODUCT MODAL ================= -->
<div id="modal" class="modal">
  <div class="modal-content">

    <h3 id="modalTitle">Add Product</h3>

    <div class="form">

      <div class="form-group">
        <label>Product Name</label>
        <input type="text" id="name" placeholder="Enter product name">
      </div>

      <div class="form-group">
        <label>Category</label>
        <select id="category">
          <option value="Uniforms">Uniforms</option>
          <option value="Books">Books</option>
          <option value="PE Wear">PE Wear</option>
          <option value="ID Laces">ID Laces</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Quantity</label>
          <input type="number" id="qty" min="0" placeholder="Enter quantity">
        </div>

        <div class="form-group">
          <label>Price (₱)</label>
          <input type="number" id="price" min="0" placeholder="Enter price">
        </div>
      </div>

    </div>

    <div class="modal-actions">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveProduct()">Save</button>
    </div>

  </div>
</div>

<!-- ================= SELL MODAL ================= -->
<div id="sellModal" class="modal">
  <div class="modal-content">

    <h3>Sell Product</h3>

    <div class="form">

      <div class="form-group">
        <label>Buyer Name</label>
        <input type="text" id="buyer" placeholder="Enter buyer name">
      </div>

      <div class="form-group">
        <label>Quantity</label>
        <input type="number" id="sellQty" min="1" placeholder="Enter quantity">
      </div>

    </div>

    <div class="modal-actions">
      <button onclick="closeSell()">Cancel</button>
      <button class="primary" onclick="confirmSell()">Confirm Sale</button>
    </div>

  </div>
</div>

<!-- ================= RECEIPT MODAL ================= -->
<div id="receiptModal" class="modal">
  <div class="modal-content receipt-style" id="receiptBox">

    <h3>BAO STORAGE</h3>
    <p class="receipt-sub">Inventory System Receipt</p>

    <div id="receiptContent"></div>

    <div class="modal-actions">
      <button onclick="printReceipt()">Print</button>
      <button onclick="closeReceipt()">Close</button>
    </div>

  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="products.js"></script>

</body>
</html>
